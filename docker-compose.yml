services:

  selenoid:
    image: "aerokube/selenoid:latest-release"
    container_name: selenoid
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - "./selenoid/browsers.json:/etc/browsers.json:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    command: ["-conf", "/etc/browsers.json", "-container-network", "selenoid_net", "-limit", "10"]
    
  selenoid-ui:
    image: "aerokube/selenoid-ui:latest"
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    networks:
      - selenoid
    command: ["--selenoid-uri", "http://selenoid:4444"]

  tests:
    build: .
    container_name: sprint_9_tests
    depends_on:
      - selenoid
    networks:
      - selenoid
    environment:
      SELENOID_URL: http://selenoid:4444/wd/hub
      BROWSER: chrome
      BROWSER_VERSION: "114.0"
    volumes:
      - ./reports:/app/reports
    command: ["pytest", "-v", "--alluredir=reports/allure-results"]

networks:
  selenoid:
    name: selenoid_net
    driver: bridge